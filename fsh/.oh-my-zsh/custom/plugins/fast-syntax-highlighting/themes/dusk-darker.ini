; Dusk Darker theme for fast-syntax-highlighting
; Palette based on Catppuccin Macchiato with Hoshino-inspired accents

[base]
default          = none
recursive-base   = #E6E9F2
unknown-token    = #FF8F9A,bold
commandseparator = #A6ADBB
redirection      = #8BD3FF
here-string-tri  = #F4DA86
here-string-text = #C6CBD6
here-string-var  = #8BD3FF,bg:#333B4B
exec-descriptor  = #DDA05C,bold
comment          = #697080
correct-subtle   = #8BD3FF
incorrect-subtle = #FF8F9A
subtle-separator = #9BE6B5
subtle-bg        = bg:#333B4B
secondary        = free

[command-point]
reserved-word  = #C4A2D4
subcommand     = #C4A2D4
alias          = #9BE6B5
suffix-alias   = #9BE6B5
global-alias   = #9BE6B5,bold
builtin        = #9BE6B5
function       = #8BD3FF
command        = #9BE6B5
precommand     = #FFB8D1
hashed-command = #9BE6B5
single-sq-bracket = #78E1D0
double-sq-bracket = #78E1D0
double-paren   = #DDA05C

[paths]
path          = #FFB8D1
pathseparator = #A6ADBB
path-to-dir   = #FFB8D1,underline
globbing      = #91ECF1,bold
globbing-ext  = #B0BCE8

[brackets]
paired-bracket  = bg:#333B4B
bracket-level-1 = #FFB8D1,bold
bracket-level-2 = #8BD3FF,bold
bracket-level-3 = #F4DA86,bold

[arguments]
single-hyphen-option   = #B0BCE8
double-hyphen-option   = #B0BCE8
back-quoted-argument   = none
single-quoted-argument = #F4DA86
double-quoted-argument = #F4DA86
dollar-quoted-argument = #DDA05C

[in-string]
back-dollar-quoted-argument           = #78E1D0
back-or-dollar-double-quoted-argument = #78E1D0

[other]
variable             = #8BD3FF
assign               = none
assign-array-bracket = #78E1D0
history-expansion    = #91ECF1,bold

[math]
mathvar = #91ECF1,bold
mathnum = #C4A2D4
matherr = #FF8F9A

[for-loop]
forvar  = #FFFFFF
fornum  = #C4A2D4
foroper = #DDA05C
forsep  = #DDA05C,bold

[case]
case-input       = #9BE6B5
case-parentheses = #DDA05C
case-condition   = bg:#333B4B
