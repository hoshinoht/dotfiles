format = """
$os\
$directory\
$git_branch\
$git_status\
$nodejs\
$bun\
$python\
$rust\
$golang\
$docker_context\
$kubernetes\
$fill\
$cmd_duration\
$line_break\
$character"""

add_newline = false
continuation_prompt = "[∙](overlay0) "
palette = "dusk"

[os]
disabled = false
style = "fg:crust bg:pink bold"
format = "[](pink)[$symbol]($style)"

[os.symbols]
Macos = " "
Linux = " "
Windows = " "

[directory]
style = "fg:crust bg:pink bold"
format = "[ $path ]($style)[](pink) "
truncation_length = 4
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "
"projects" = "󰲋 "

[git_branch]
symbol = " "
style = "fg:sky bg:surface0 bold"
format = "[](surface0)[ $symbol$branch ]($style)[](surface0) "

[git_status]
style = "fg:yellow bg:surface1"
format = "([](surface1)[ $all_status$ahead_behind]($style)[](surface1) )"
conflicted = "=${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕${ahead_count}/${behind_count} "
up_to_date = ""
untracked = "?${count} "
stashed = "≡${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[nodejs]
symbol = " "
style = "fg:green"
format = "[$symbol$version ]($style)"

[bun]
symbol = " "
style = "fg:peach"
format = "[$symbol$version ]($style)"

[python]
symbol = " "
style = "fg:yellow"
format = "[$symbol$version ]($style)"

[rust]
symbol = "󱘗 "
style = "fg:peach"
format = "[$symbol$version ]($style)"

[golang]
symbol = " "
style = "fg:blue"
format = "[$symbol$version ]($style)"

[docker_context]
symbol = " "
style = "fg:sapphire"
format = "[$symbol$context ]($style)"

[kubernetes]
disabled = false
symbol = "󱃾 "
style = "fg:lavender"
format = "[$symbol$context ]($style)"
detect_files = ["Chart.yaml", "helmfile.yaml", "kustomization.yaml", "skaffold.yaml"]
detect_folders = ["charts", "k8s", "kubernetes"]

[fill]
symbol = " "

[cmd_duration]
min_time = 2_000
style = "fg:overlay1"
format = "[$duration ]($style)"

[time]
disabled = true

[line_break]
disabled = false

[character]
success_symbol = "[❯](pink)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](mauve)"

