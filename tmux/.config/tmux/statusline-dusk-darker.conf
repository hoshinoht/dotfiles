# vim: ft=tmux
# ━━━ Dusk Darker · Riced ━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Pane Borders ──
set -g pane-border-style "fg=#333B4B"
set -g pane-active-border-style "fg=#8BD3FF"
set -g pane-border-lines heavy

# ── Popups ──
set -g popup-border-style "fg=#8BD3FF"
set -g popup-border-lines rounded

# ── Copy / Messages ──
set -g mode-style "fg=#FFFFFF,bg=#333B4B"
set -g message-style "fg=#171A22,bg=#DDA05C,bold"
set -g message-command-style "fg=#FFFFFF,bg=#333B4B"

# ── Status Bar ──
set -g status on
set -g status-interval 30
set -g status-justify left
set -g status-position bottom
set -g status-style "fg=#858B9C,bg=#171A22"
set -g status-left-length 100
set -g status-right-length 100

# Left ─ session pill (pink)
set -g status-left "#[fg=#FFB8D1]#[fg=#171A22,bg=#FFB8D1,bold]  #S #[bg=default,fg=#FFB8D1,nobold] "

# Right ─ supporting date + prominent time + low-priority user
set -g status-right "#[fg=#333B4B]#[fg=#C6CBD6,bg=#333B4B]  %a %d #[bg=default,fg=#333B4B,nobold]  #[fg=#8BD3FF]#[fg=#171A22,bg=#8BD3FF,bold]  %H:%M #[bg=default,fg=#8BD3FF,nobold]  #[fg=#697080]· #[fg=#A6ADBB]#{user}"

# ── Window Tabs ──
setw -g window-status-activity-style "none"
setw -g window-status-separator ""
setw -g window-status-format "  #[fg=#858B9C]#I #[fg=#A6ADBB]#{b:pane_current_path} "
setw -g window-status-current-format " #[fg=#333B4B]#[fg=#8BD3FF,bg=#333B4B,bold] #I #[fg=#FFFFFF]#{b:pane_current_path}#{?window_zoomed_flag, 󰊓,} #[bg=default,fg=#333B4B,nobold]"

# ── Misc ──
set -g clock-mode-colour "#8BD3FF"
set -g clock-mode-style 24
