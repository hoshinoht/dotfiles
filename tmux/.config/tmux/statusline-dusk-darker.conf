# vim: ft=tmux
# ━━━ Dusk Darker · Riced ━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Pane Borders ──
set -g pane-border-style "fg=#383B44"
set -g pane-active-border-style "fg=#8BD3FF"
set -g pane-border-lines heavy

# ── Popups ──
set -g popup-border-style "fg=#8BD3FF"
set -g popup-border-lines rounded

# ── Copy / Messages ──
set -g mode-style "fg=#FFFFFF,bg=#383B44"
set -g message-style "fg=#171A22,bg=#DDA05C,bold"
set -g message-command-style "fg=#FFFFFF,bg=#383B44"

# ── Status Bar ──
set -g status on
set -g status-interval 30
set -g status-justify left
set -g status-position bottom
set -g status-style "fg=#898B95,bg=#171A22"
set -g status-left-length 100
set -g status-right-length 100

# Left ─ session pill (pink), led by the Starship canvas-to-pink fade
set -g status-left "#[bg=#634751] #[bg=#AD7D8E] #[fg=#171A22,bg=#FFB8D1,bold]  #S #[bg=default,fg=#FFB8D1,nobold] "

# Right ─ date rail running into the clock pill (one group) + low-priority user
set -g status-right "#[fg=#383B44]#[fg=#C9CAD6,bg=#383B44]  %a %d #[fg=#8BD3FF,bg=#383B44]#[fg=#171A22,bg=#8BD3FF,bold]  %H:%M #[bg=default,fg=#8BD3FF,nobold]  #[fg=#6D707A]· #[fg=#AAACB7]#{user}"

# ── Window Tabs ──
setw -g window-status-activity-style "none"
setw -g window-status-bell-style "none"
setw -g window-status-separator ""
setw -g window-status-format "#{?window_start_flag,#[fg=#2A2D35]#[bg=#171A22],}#[bg=#2A2D35]#{?window_bell_flag,#[bg=#2A2D35] #[fg=#FFDADB]#[bg=#7D2936]#[bold] #I #{b:pane_current_path} #[nobold]#[bg=#2A2D35] ,#{?window_activity_flag,#[bg=#2A2D35] #[fg=#FBE18C]#[bg=#564500] #I #{b:pane_current_path} #[bg=#2A2D35] ,#[fg=#898B95] #I #[fg=#AAACB7]#{b:pane_current_path} }}#{?window_end_flag,#[fg=#2A2D35]#[bg=#171A22],}"
setw -g window-status-current-format "#{?window_start_flag,#[fg=#383B44]#[bg=#171A22],#[fg=#383B44]#[bg=#2A2D35]}#[fg=#8BD3FF]#[bg=#383B44] #I #[fg=#FFFFFF]#[bold]#{b:pane_current_path}#[nobold]#{?window_zoomed_flag,#[fg=#8BD3FF] 󰊓,} #{?window_end_flag,#[fg=#383B44]#[bg=#171A22],#[fg=#383B44]#[bg=#2A2D35]}"

# ── Misc ──
set -g clock-mode-colour "#8BD3FF"
set -g clock-mode-style 24
