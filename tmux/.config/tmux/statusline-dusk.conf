# vim: ft=tmux
# ━━━ Dusk · Riced ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Pane Borders ──
set -g pane-border-style "fg=#454850"
set -g pane-active-border-style "fg=#75D6F6"
set -g pane-border-lines heavy

# ── Popups ──
set -g popup-border-style "fg=#75D6F6"
set -g popup-border-lines rounded

# ── Copy / Messages ──
set -g mode-style "fg=#F3F5FC,bg=#454850"
set -g message-style "fg=#26282D,bg=#DDA05C,bold"
set -g message-command-style "fg=#F3F5FC,bg=#454850"

# ── Status Bar ──
set -g status on
set -g status-interval 1
set -g status-justify left
set -g status-position bottom
set -g status-style "fg=#7E828F,bg=#26282D"
set -g status-left-length 100
set -g status-right-length 100

# Left ─ session pill (pink), led by the Starship canvas-to-pink fade
set -g status-left "#[bg=#594D54] #[bg=#8C727C] #[fg=#26282D,bg=#F3BDCA,bold]  #S #[bg=default,fg=#F3BDCA,nobold] "

# Right ─ date rail running into the clock pill (one group) + user pill (pink)
set -g status-right "#[fg=#454850]#[fg=#B2B6C1,bg=#454850]  %a %d #[fg=#75D6F6,bg=#454850]#[fg=#26282D,bg=#75D6F6,bold]  %H:%M #[bg=default,fg=#75D6F6,nobold]  #[fg=#F3BDCA]#[fg=#26282D,bg=#F3BDCA,bold]  #(whoami) #[bg=default,fg=#F3BDCA,nobold]"

# ── Window Tabs ──
setw -g window-status-activity-style "none"
setw -g window-status-bell-style "none"
setw -g window-status-separator ""
setw -g window-status-format "#{?window_start_flag,#[fg=#393C43]#[bg=#26282D],}#[bg=#393C43]#{?window_bell_flag,#[bg=#393C43] #[fg=#FFDAD8]#[bg=#7D2A2D]#[bold] #I #{b:pane_current_path} #[nobold]#[bg=#393C43] ,#{?window_activity_flag,#[bg=#393C43] #[fg=#FCE095]#[bg=#564507] #I #{b:pane_current_path} #[bg=#393C43] ,#[fg=#7E828F] #I #[fg=#8F939F]#{b:pane_current_path} }}#{?window_end_flag,#[fg=#393C43]#[bg=#26282D],}"
setw -g window-status-current-format "#{?window_start_flag,#[fg=#454850]#[bg=#26282D],#[fg=#454850]#[bg=#393C43]}#[fg=#F3F5FC]#[bg=#454850] #I #[fg=#F3F5FC]#[bold]#{b:pane_current_path}#[nobold]#{?window_zoomed_flag,#[fg=#75D6F6] 󰊓,} #{?window_end_flag,#[fg=#454850]#[bg=#26282D],#[fg=#454850]#[bg=#393C43]}"

# ── Misc ──
set -g clock-mode-colour "#75D6F6"
set -g clock-mode-style 24
